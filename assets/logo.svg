<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111A2E"/>
      <stop offset="100%" stop-color="#090D18"/>
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Core Dynamic Uplift Ribbon Gradient -->
    <linearGradient id="upliftGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="35%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Counterfactual Orbit Control Gradient -->
    <linearGradient id="controlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Counterfactual Orbit Treatment Gradient -->
    <linearGradient id="treatmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Atmospheric Glow Filter -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Subtle Ambient Internal Ring (Counterfactual Nexus) -->
  <circle cx="32" cy="32" r="22" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Left Counterfactual Curve (Control Group Orbit - Y0) -->
  <path d="M16 38 C 16 26, 26 18, 32 18 C 36 18, 41 21, 44 26" stroke="url(#controlGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="32" stroke-dashoffset="0"/>

  <!-- Right Counterfactual Curve (Treatment Group Orbit - Y1) -->
  <path d="M48 26 C 48 38, 38 46, 32 46 C 28 46, 23 43, 20 38" stroke="url(#treatmentGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Central Causal Lift Prism (Delta / Tau Arrow Vector) -->
  <path d="M32 14 L42 36 L32 31 L22 36 Z" fill="url(#upliftGrad)" filter="url(#coreGlow)"/>
  
  <!-- Central Intersection Core Apex -->
  <circle cx="32" cy="14" r="3" fill="#FFFFFF" filter="url(#coreGlow)"/>

  <!-- Control & Treatment Causal Evidence Nodes -->
  <circle cx="18" cy="38" r="2.5" fill="#60A5FA" filter="url(#softGlow)"/>
  <circle cx="46" cy="26" r="2.5" fill="#34D399" filter="url(#softGlow)"/>
  <circle cx="32" cy="46" r="2" fill="#818CF8"/>

  <!-- Uplift Vector Core Spine -->
  <line x1="32" y1="18" x2="32" y2="31" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
</svg>
